<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rodis STUDIO — Boutique Express WhatsApp</title>
  <script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.tailwindcss.com"></script>
  <!-- NOUVEAU : CONNEXION AU MOTEUR SUPABASE CLOUD -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

</head>
<body class="bg-stone-50 text-stone-900 min-h-screen pb-24">

  <!-- BANDEAU MODE ADMIN (CACHÉ POUR LES CLIENTS) -->
  <div id="admin-banner" class="hidden bg-amber-500 text-stone-950 px-4 py-2 text-xs font-bold">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <span>🔓 MODE VENDEUR ACTIF : Tu peux ajouter ou supprimer des articles</span>
      <button onclick="logoutAdmin()" class="bg-stone-950 text-white px-2.5 py-1 rounded-md text-[11px]">
        Verrouiller 🔒
      </button>
    </div>
  </div>

  <!-- EN-TÊTE DE LA BOUTIQUE -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-stone-200">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <div>
        <span class="text-[11px] font-extrabold tracking-widest uppercase text-emerald-600">Livraison en 24h</span>
        <h1 class="text-xl font-black tracking-tight">Rodis STUDIO</h1>
      </div>
      <div class="flex items-center gap-2">
        <!-- BOUTON CADENAS VENDEUR -->
        <button id="admin-lock-btn" onclick="unlockAdmin()" class="border border-stone-300 bg-stone-100 text-stone-700 px-3 py-2 rounded-full text-xs font-bold hover:bg-stone-200 transition">
          🔒 Vendeur
        </button>
        <!-- BOUTON + PRODUIT (VISIBLE UNIQUEMENT SI DÉVERROUILLÉ) -->
        <button id="add-product-btn" onclick="toggleAdmin(true)" class="hidden bg-amber-500 text-stone-950 px-3 py-2 rounded-full text-xs font-extrabold hover:bg-amber-400 transition">
          + Produit
        </button>
        <button onclick="toggleCart(true)" class="relative flex items-center gap-2 bg-stone-900 text-white px-4 py-2 rounded-full text-sm font-semibold hover:bg-stone-800 transition">
          <span>Panier</span>
          <span id="cart-badge" class="bg-emerald-500 text-stone-950 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
        </button>
      </div>
    </div>

    <!-- BARRE DE CATÉGORIES -->
    <div class="max-w-5xl mx-auto px-4 pb-3 flex gap-2 overflow-x-auto">
      <button onclick="filterCategory('tous')" class="cat-btn bg-stone-900 text-white px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap" data-cat="tous">Tous les articles</button>
      <button onclick="filterCategory('vetements')" class="cat-btn bg-stone-200 text-stone-700 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap" data-cat="vetements">Vêtements</button>
      <button onclick="filterCategory('accessoires')" class="cat-btn bg-stone-200 text-stone-700 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap" data-cat="accessoires">Montres & Accessoires</button>
      <button onclick="filterCategory('sacs')" class="cat-btn bg-stone-200 text-stone-700 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap" data-cat="sacs">Sacs</button>
      <button onclick="filterCategory('chaussures')" class="cat-btn bg-stone-200 text-stone-700 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap" data-cat="chaussures">Chaussures</button>
    </div>
  </header>

  <!-- RECHERCHE & GRILLE DES PRODUITS -->
  <main class="max-w-5xl mx-auto px-4 py-6">
    <div class="mb-6">
      <input 
        id="search-input" 
        type="text" 
        oninput="handleSearch(this.value)" 
        placeholder="🔍 Rechercher un article (ex: montre, sac, hoodie...)" 
        class="w-full bg-white border border-stone-300 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-600 shadow-xs"
      >
    </div>

    <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
  </main>

  <!-- FENÊTRE D'AJOUT DE PRODUIT (MODE VENDEUR) -->
  
  <div id="admin-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
    <div onclick="toggleAdmin(false)" class="absolute inset-0 bg-black/50 backdrop-blur-xs"></div>
    <div class="relative bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-3 z-10">
      <div class="flex items-center justify-between border-b border-stone-100 pb-2">
        <h2 class="text-base font-black">Ajouter un nouvel article</h2>
        <button onclick="toggleAdmin(false)" class="text-xs font-bold text-stone-500 bg-stone-100 px-2.5 py-1 rounded-lg">✕</button>
      </div>
      <input id="new-name" type="text" placeholder="Nom de l'article (ex: Casquette Noire)" class="w-full px-3 py-2 text-sm border border-stone-300 rounded-xl">
      <input id="new-price" type="number" placeholder="Prix en FCFA (ex: 12000)" class="w-full px-3 py-2 text-sm border border-stone-300 rounded-xl">
      <select id="new-category" class="w-full px-3 py-2 text-sm border border-stone-300 rounded-xl bg-white">
        <option value="vetements">Catégorie : Vêtements</option>
        <option value="accessoires">Catégorie : Montres & Accessoires</option>
        <option value="sacs">Catégorie : Sacs</option>
        <option value="chaussures">Catégorie : Chaussures</option>
      </select>

      <!-- NOUVEAU : SÉLECTEUR DE PHOTO DEPUIS LA GALERIE OU L'APPAREIL PHOTO -->
      <div class="border-2 border-dashed border-stone-300 rounded-xl p-3 text-center bg-stone-50">
        <label class="cursor-pointer block">
          <span class="text-xs font-bold text-emerald-700 block mb-1.5">📸 Choisir une photo sur le téléphone</span>
          <input id="new-image-file" type="file" accept="image/*" onchange="previewSelectedImage(this)" class="text-xs text-stone-500 w-full file:mr-2 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-stone-900 file:text-white">
        </label>
        <img id="image-preview" class="hidden w-full h-32 object-cover rounded-lg mt-2 border border-stone-200" alt="Aperçu de l'article">
      </div>

      <button id="publish-btn" onclick="addNewProduct()" class="w-full bg-stone-900 hover:bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-sm transition">
        Publier dans la boutique
      </button>
    </div>
  </div>

  <!-- TIROIR DU PANIER -->
  <div id="cart-modal" class="fixed inset-0 z-50 hidden">
    <div onclick="toggleCart(false)" class="absolute inset-0 bg-black/50 backdrop-blur-xs"></div>
    <div class="absolute right-0 top-0 h-full w-full max-w-md bg-white shadow-2xl flex flex-col">
      <div class="p-4 border-b border-stone-200 flex items-center justify-between">
        <h2 class="text-lg font-bold">Ton Panier Express</h2>
        <button onclick="toggleCart(false)" class="text-stone-500 hover:text-stone-900 text-sm font-semibold px-3 py-1 rounded-lg bg-stone-100">Fermer ✕</button>
      </div>
      <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
      <div class="p-4 bg-stone-50 border-t border-stone-200 space-y-3">
        <div class="grid grid-cols-2 gap-2">
          <input id="client-name" type="text" oninput="updateWhatsAppPreview()" placeholder="Ton prénom *" class="w-full px-3 py-2 text-sm border border-stone-300 rounded-lg">
          <input id="client-address" type="text" oninput="updateWhatsAppPreview()" placeholder="Quartier / Ville *" class="w-full px-3 py-2 text-sm border border-stone-300 rounded-lg">
        </div>
        <input id="vendor-phone" type="text" value="22890000000" oninput="updateWhatsAppPreview()" placeholder="Numéro WhatsApp vendeur" class="w-full px-3 py-2 text-xs border border-stone-300 rounded-lg bg-white text-stone-600">
        <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-xs text-stone-800 font-mono whitespace-pre-line max-h-32 overflow-y-auto" id="whatsapp-preview"></div>
        <div class="flex items-center justify-between pt-1">
          <span class="text-sm text-stone-600">Total à payer :</span>
          <span id="cart-total" class="text-lg font-black text-stone-900">0 FCFA</span>
        </div>
        <button onclick="checkoutWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md transition">
          Commander sur WhatsApp
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
