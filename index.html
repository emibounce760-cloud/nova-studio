<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA STUDIO — Boutique Express WhatsApp</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen pb-24">

  <!-- EN-TÊTE DE LA BOUTIQUE -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-stone-200">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <div>
        <span class="text-xs font-bold tracking-widest uppercase text-emerald-600">Livraison en 24h</span>
        <h1 class="text-xl font-black tracking-tight">NOVA STUDIO</h1>
      </div>
      <button onclick="toggleCart(true)" class="relative flex items-center gap-2 bg-stone-900 text-white px-4 py-2.5 rounded-full text-sm font-semibold hover:bg-stone-800 transition">
        <span>Panier</span>
        <span id="cart-badge" class="bg-emerald-500 text-stone-950 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
      </button>
    </div>

    <!-- BARRE DE CATÉGORIES -->
    <div class="max-w-5xl mx-auto px-4 pb-3 flex gap-2 overflow-x-auto">
      <button onclick="filterCategory('tous')" class="cat-btn bg-stone-900 text-white px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap" data-cat="tous">Tous les articles</button>
      <button onclick="filterCategory('vetements')" class="cat-btn bg-stone-200 text-stone-700 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap" data-cat="vetements">Vêtements</button>
      <button onclick="filterCategory('accessoires')" class="cat-btn bg-stone-200 text-stone-700 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap" data-cat="accessoires">Montres & Accessoires</button>
      <button onclick="filterCategory('sacs')" class="cat-btn bg-stone-200 text-stone-700 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap" data-cat="sacs">Sacs</button>
      <button onclick="filterCategory('chaussures')" class="cat-btn bg-stone-200 text-stone-700 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap" data-cat="chaussures">Chaussures</button>
    </div>
  </header>

  <!-- GRILLE DES PRODUITS -->
  <main class="max-w-5xl mx-auto px-4 py-6">
    <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
  </main>

  <!-- TIROIR DU PANIER (CACHÉ PAR DÉFAUT) -->
  <div id="cart-modal" class="fixed inset-0 z-50 hidden">
    <div onclick="toggleCart(false)" class="absolute inset-0 bg-black/50 backdrop-blur-xs"></div>
    <div class="absolute right-0 top-0 h-full w-full max-w-md bg-white shadow-2xl flex flex-col">
      <div class="p-4 border-b border-stone-200 flex items-center justify-between">
        <h2 class="text-lg font-bold">Ton Panier Express</h2>
        <button onclick="toggleCart(false)" class="text-stone-500 hover:text-stone-900 text-sm font-semibold px-3 py-1 rounded-lg bg-stone-100">Fermer ✕</button>
      </div>

      <!-- LISTE DES ARTICLES AJOUTÉS -->
      <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

      <!-- FORMULAIRE & APERÇU WHATSAPP -->
      <div class="p-4 bg-stone-50 border-t border-stone-200 space-y-3">
        <div class="grid grid-cols-2 gap-2">
          <input id="client-name" type="text" oninput="updateWhatsAppPreview()" placeholder="Ton prénom *" class="w-full px-3 py-2 text-sm border border-stone-300 rounded-lg focus:outline-none focus:border-emerald-600">
          <input id="client-address" type="text" oninput="updateWhatsAppPreview()" placeholder="Quartier / Ville *" class="w-full px-3 py-2 text-sm border border-stone-300 rounded-lg focus:outline-none focus:border-emerald-600">
        </div>
        <input id="vendor-phone" type="text" value="22890000000" oninput="updateWhatsAppPreview()" placeholder="Numéro WhatsApp vendeur (ex: 228...)" class="w-full px-3 py-2 text-xs border border-stone-300 rounded-lg bg-white text-stone-600">

        <!-- BULLE APERÇU WHATSAPP -->
        <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-xs text-stone-800 font-mono whitespace-pre-line max-h-32 overflow-y-auto" id="whatsapp-preview"></div>

        <div class="flex items-center justify-between pt-1">
          <span class="text-sm text-stone-600">Total à payer :</span>
          <span id="cart-total" class="text-lg font-black text-stone-900">0 FCFA</span>
        </div>

        <button onclick="checkoutWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md transition flex items-center justify-center gap-2">
          <span>Commander sur WhatsApp</span>
        </button>
      </div>
    </div>
  </div>

  <!-- LE CÂBLE QUI RELIE CETTE PAGE AU FICHIER app.js -->
  <script src="app.js"></script>
</body>
</html>
